[package]
name = "lazyTrino"
version = "0.1.0"
edition = "2024"
description = "Terminal UI (TUI) for browsing Trino and Presto catalogs, schemas, tables, metadata, and query results"
license = "Apache-2.0"
repository = "https://github.com/Codesmith28/lazyTrino"
homepage = "https://github.com/Codesmith28/lazyTrino"
readme = "README.md"
keywords = ["trino", "presto", "tui", "ratatui", "sql"]
categories = ["command-line-utilities", "database"]


[lib]
name = "lazy_trino"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
arboard = "3"
dirs = "5"
toml = "0.8"

[dev-dependencies]
mockito = "1"
