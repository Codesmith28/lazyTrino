name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag-info.outputs.tag }}
      should_release: ${{ steps.tag-info.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag and release eligibility
        id: tag-info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Workflow triggered by tag push: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
            TAG="v${VERSION}"
            echo "Resolved release tag from Cargo.toml: $TAG"
            if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on origin. Skipping release creation."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG does not exist. Creating and pushing tag to trigger release..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create Release
        if: steps.tag-info.outputs.should_release == 'true'
        uses: taiki-e/create-gh-release-action@v1
        with:
          ref: refs/tags/${{ steps.tag-info.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build & Upload Release Binaries
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and Upload Rust Binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lazyTrino
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
