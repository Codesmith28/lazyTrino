name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Environment optimizations for Rust CI builds
env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation in CI to reduce compiler overhead and prevent cache bloat
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ⚡ Fail fast on code formatting errors in ~3 seconds BEFORE downloading/restoring dependency caches
      - name: Check code formatting
        run: cargo fmt --check

      # 📦 Cache cargo registry, index, and compiled build artifacts for fast subsequent runs (~20-40s)
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run unit tests
        run: cargo test --all
